name: Build
on:
  push:
    paths-ignore:
    - 'README.md'
    - 'docs/'
  pull_request:
    paths-ignore:
    - 'README.md'
    - 'docs/'
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [ubuntu-latest, windows-latest, macos-latest]
            include:
              - os: ubuntu-latest
                build: sh ./build.sh
              - os: windows-latest
                build: .\build.cmd
              - os: macos-latest
                build: bash ./build.sh
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Build
      run: ${{ matrix.build }}
